- name: Update app
  hosts: all
  gather_facts: yes
  pre_tasks:
    - name: Validate ARCA configuration
      assert:
        that:
          - lookup('env', 'ARCA_URI') is match('^https?://[^ ]+$')
        fail_msg: "Falta ARCA_URI; ejecuta el despliegue con bash ansible/deploy.sh"
  tasks:
    - name: Stop old version
      command: pm2 stop app.js
      ignore_errors: yes
    - name: Extract new version
      unarchive:
        src: ../node/src.zip
        dest: ~/.
        owner: azureuser
        group: azureuser
    - name: Install dependencies
      command: npm install
    # - name: Start new version
      # command: pm2 start app.js
      
    # Redis - verifico las credenciales antes de iniciar la app
    - name: Validate Redis configuration
      assert:
        that:
          - lookup('env', 'REDIS_HOST') | length > 0
          - lookup('env', 'REDIS_PASSWORD') | length > 0
        fail_msg: "Faltan las credenciales de Redis"
      when: lookup('env', 'REDIS_ENABLED') == 'true'
      no_log: true

    # Redis - elimino el proceso detenido para actualizar su configuracion
    - name: Remove old PM2 process
      command: pm2 delete app.js
      ignore_errors: yes

    # Redis - inicio arVault con las variables de conexion
    - name: Start new version with Redis configuration
      command: pm2 start app.js
      environment:
        DD_AGENT_HOST: "127.0.0.1"
        DD_DOGSTATSD_PORT: "8125"
        DD_ENV: "azure"
        ARCA_URI: "{{ lookup('env', 'ARCA_URI') }}"
        REDIS_ENABLED: "{{ lookup('env', 'REDIS_ENABLED') | default('false', true) }}"
        REDIS_HOST: "{{ lookup('env', 'REDIS_HOST') }}"
        REDIS_PORT: "{{ lookup('env', 'REDIS_PORT') | default('10000', true) }}"
        REDIS_PASSWORD: "{{ lookup('env', 'REDIS_PASSWORD') }}"
      no_log: true