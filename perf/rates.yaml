config:
  target: "{{ $processEnvironment.TARGET }}"
  http:
    timeout: 10
  phases:
    - name: "Cotizaciones: 10 llegadas por segundo"
      duration: 60
      arrivalRate: 10
  processor: "./processor.js"
  plugins:
    publish-metrics:
      - type: datadog
        apiKey: "{{ $processEnvironment.DATADOG_API_KEY }}"
        apiHost: "{{ $processEnvironment.DATADOG_SITE }}"
        prefix: "artillery."
        event:
          send: false
        tags:
          - "service:arvault"
          - "source:artillery"
          - "test:rates"
          - "case:{{ $processEnvironment.TP2_CASE }}"
          - "run:{{ $processEnvironment.TP2_RUN_ID }}"

scenarios:
  - name: "Consultar cotizaciones"
    flow:
      - get:
          url: "/rates"
          afterResponse: "trackRates"
