config:
  target: "{{ $processEnvironment.TARGET }}"
  http:
    timeout: 10
  phases:
    - name: "Inicio: 1 llegada por segundo"
      duration: 30
      arrivalRate: 1
    - name: "Subida: de 1 a 10 llegadas por segundo"
      duration: 60
      arrivalRate: 1
      rampTo: 10
    - name: "Carga sostenida: 10 llegadas por segundo"
      duration: 60
      arrivalRate: 10
  processor: "./processor.js"
  plugins:
    publish-metrics:
      - type: datadog
        apiKey: "{{ $processEnvironment.DATADOG_API_KEY }}"
        apiHost: "{{ $processEnvironment.DATADOG_SITE }}"
        prefix: "artillery."
        event:
          send: false
        tags:
          - "service:arvault"
          - "source:artillery"
          - "test:exchange-ramp"
          - "case:{{ $processEnvironment.TP2_CASE }}"
          - "run:{{ $processEnvironment.TP2_RUN_ID }}"

scenarios:
  - name: "Cambiar ARS a USD"
    flow:
      - post:
          url: "/exchange"
          json: {}
          beforeRequest: "prepareExchange"
          afterResponse: "trackExchange"
